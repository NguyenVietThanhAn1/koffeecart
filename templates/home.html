{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container">
  <section class="hero mb-5">
    <img src="{% static 'images/banner.webp' %}" width="1408" height="524"
         alt="KoffeeCart: premium beans, timeless tradition. Sacks of roasted and green coffee beans.">
  </section>

  <section>
    <div class="d-flex justify-content-between align-items-end mb-3">
      <h2 class="section-title h3 mb-0">Our coffee</h2>
      <a href="{% url 'store' %}" class="btn btn-outline-primary btn-sm">See all <i class="fas fa-arrow-right ms-1" aria-hidden="true"></i></a>
    </div>

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3 g-lg-4">
      {% for product in products %}
      <div class="col">{% include 'includes/product_card.html' %}</div>
      {% empty %}
      <p class="text-body-secondary">No products yet. Run <code>python manage.py seed_demo</code> to add some.</p>
      {% endfor %}
    </div>
  </section>
</div>
{% endblock %}
