{% load store_extras %}
<div class="card product-card h-100 position-relative">
  <img src="{{ product.images.url }}" class="card-img-top" alt="{{ product.product_name }}" loading="lazy">
  <div class="card-body d-flex flex-column">
    <span class="small text-body-secondary">{{ product.category.category_name }}</span>
    <h3 class="card-title h6 mb-1"><a href="{{ product.get_url }}">{{ product.product_name }}</a></h3>
    <div class="mb-2">{% stars product.averageReview product.countReview %}</div>
    <div class="mt-auto d-flex justify-content-between align-items-center">
      <span class="price">${{ product.price }}</span>
      {% if product.stock <= 0 %}<span class="badge text-bg-secondary">Sold out</span>{% endif %}
    </div>
  </div>
</div>
