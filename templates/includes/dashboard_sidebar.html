{% with path=request.resolver_match.url_name %}
<aside class="col-lg-3 mb-4">
  <div class="list-group">
    <a class="list-group-item list-group-item-action {% if path == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}"><i class="fas fa-th-large fa-fw me-2" aria-hidden="true"></i>Dashboard</a>
    <a class="list-group-item list-group-item-action {% if path == 'my_orders' or path == 'order_detail' %}active{% endif %}" href="{% url 'my_orders' %}"><i class="fas fa-receipt fa-fw me-2" aria-hidden="true"></i>My orders</a>
    <a class="list-group-item list-group-item-action {% if path == 'edit_profile' %}active{% endif %}" href="{% url 'edit_profile' %}"><i class="fas fa-user-edit fa-fw me-2" aria-hidden="true"></i>Edit profile</a>
    <a class="list-group-item list-group-item-action {% if path == 'change_password' %}active{% endif %}" href="{% url 'change_password' %}"><i class="fas fa-key fa-fw me-2" aria-hidden="true"></i>Change password</a>
  </div>
  <form action="{% url 'logout' %}" method="POST" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-primary w-100"><i class="fas fa-power-off me-2" aria-hidden="true"></i>Log out</button>
  </form>
</aside>
{% endwith %}
