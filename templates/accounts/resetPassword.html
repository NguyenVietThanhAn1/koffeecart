{% extends 'base.html' %}

{% block title %}Reset password | KoffeeCart{% endblock %}

{% block content %}
<div class="container">
  <div class="card auth-card mx-auto">
    <div class="card-body p-4">
      <h1 class="h4 mb-4">Choose a new password</h1>
      <form action="{% url 'resetPassword' %}" method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label for="reset-password" class="form-label">New password</label>
          <input type="password" id="reset-password" name="password" class="form-control" autocomplete="new-password" required autofocus>
        </div>
        <div class="mb-3">
          <label for="reset-confirm" class="form-label">Confirm new password</label>
          <input type="password" id="reset-confirm" name="confirm_password" class="form-control" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Reset password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
