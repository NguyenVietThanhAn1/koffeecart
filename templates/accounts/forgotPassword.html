{% extends 'base.html' %}

{% block title %}Forgot password | KoffeeCart{% endblock %}

{% block content %}
<div class="container">
  <div class="card auth-card mx-auto">
    <div class="card-body p-4">
      <h1 class="h4 mb-2">Forgot your password?</h1>
      <p class="text-body-secondary small">Enter your email. If it belongs to an account, we will send a reset link.</p>
      <form action="{% url 'forgotPassword' %}" method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label for="forgot-email" class="form-label">Email</label>
          <input type="email" id="forgot-email" name="email" class="form-control" autocomplete="email" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100">Send reset link</button>
      </form>
    </div>
  </div>
  <p class="text-center mt-3"><a href="{% url 'login' %}">Back to sign in</a></p>
</div>
{% endblock %}
