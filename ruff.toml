# Lint config. Run: ruff check .
# Kept small on purpose: real bugs (unused/undefined names, bare except, print left in code),
# not style opinions.
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[lint]
select = [
    "E4", "E7", "E9",  # import placement, bare except, comparison to None, syntax errors
    "F",               # pyflakes: unused imports/variables, undefined names
    "B",               # bugbear: likely bugs
    "T20",             # no print() left in code
]
