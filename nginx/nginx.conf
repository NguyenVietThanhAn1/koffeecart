# Mounted as /etc/nginx/conf.d/default.conf, which nginx includes inside its http {} block,
# so http-level directives (upstream, map, limit_req_zone) are allowed at the top of this file.

upstream django_app {
    server web:8000;
}

# ── Rate limiting ────────────────────────────────────────
# Brute force / credential stuffing protection for the account forms. Only POSTs count:
# an empty key is not limited, so simply opening the login page never hits the limit.
# Note: the key is the client IP as nginx sees it. If another proxy or load balancer is put
# in front of this one, configure real_ip (set_real_ip_from + real_ip_header) first, or every
# visitor will share the proxy's IP and its limit.
map $request_method $account_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $account_post_key   zone=account_forms:10m rate=10r/m;
# A generous per-IP ceiling for everything Django serves (static/media are not counted).
limit_req_zone $binary_remote_addr zone=app:10m           rate=20r/s;
limit_req_status 429;
limit_req_log_level warn;

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;
    server_tokens off;  # do not advertise the nginx version

    # ── Logs ─────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ── Security headers ─────────────────────────────────
    # Content-Security-Policy is set by Django (koffeecart/middleware.py), so it is tested
    # with the app. add_header inside a location replaces these, so locations that set
    # their own add_header repeat the ones they need.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Compression ──────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ── Proxy settings, inherited by every location that proxies to Django ──
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;

    # Used by the container healthcheck; never touches Django.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # ── Static files ──────────────────────────────────────
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── Media files ───────────────────────────────────────
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── Account forms: 10 POSTs per minute per IP, short burst allowed ──
    location ~ ^/accounts/(login|register|forgotPassword|resetPassword)/$ {
        limit_req zone=account_forms burst=5 nodelay;
        limit_req zone=app burst=40 nodelay;
        proxy_pass http://django_app;
    }

    # ── Everything else goes to Django ────────────────────
    location / {
        limit_req zone=app burst=40 nodelay;
        proxy_pass http://django_app;
    }
}
